<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>El Tiet · {{TITLE}}</title>
<!-- Built by llista.py from llista/{{SLUG}}/list.json. Edit the template, never the built page. -->
<style>
/* Low key: black, white and greys. The Reels bring the only colour. */
:root{--bg:#fafafa;--fg:#111;--muted:#6b6b6b;--line:#e2e2e2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--fg:#f2f2f2;--muted:#9a9a9a;--line:#2a2a2a}}
:root[data-theme="dark"]{--bg:#0d0d0d;--fg:#f2f2f2;--muted:#9a9a9a;--line:#2a2a2a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.35 -apple-system,system-ui,"Helvetica Neue",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg.i{width:1em;height:1em;fill:currentColor;vertical-align:-.12em;flex:none}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-variant-numeric:tabular-nums}
.stats span{display:inline-flex;align-items:center;gap:3px}

/* The list */
#list{max-width:640px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 48px}
header{display:flex;gap:14px;align-items:center;margin-bottom:18px}
header img{width:52px;height:52px;flex:none;filter:grayscale(1)}
h1{font-size:24px;line-height:1.15;margin:0 0 4px}
header p{margin:0;color:var(--muted);font-size:15px}
.play-all{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;margin:0 0 18px;
  border-radius:14px;background:var(--fg);color:var(--bg);font-weight:700;font-size:17px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}
.item{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;text-align:left}
.cover{position:relative;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:#000;color:#fff}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover::after{content:"";position:absolute;inset:auto 0 0 0;height:35%;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.chip{position:absolute;left:7px;top:7px;z-index:1;padding:2px 7px;border-radius:8px;background:rgba(0,0,0,.6);
  font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.tri{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;z-index:1;border-radius:50%;
  background:rgba(0,0,0,.4);display:grid;place-items:center}
.tri::before{content:"";margin-left:4px;border-style:solid;border-width:8px 0 8px 13px;border-color:transparent transparent transparent #fff}
.cover .stats{position:absolute;left:7px;right:7px;bottom:7px;z-index:1;font-size:12px;font-weight:600;gap:2px 8px}
.item p{margin:7px 2px 0;font-size:14px;line-height:1.3}
.item .when{margin-top:2px;color:var(--muted);font-size:12px}
.seen .cover img{opacity:.5}
.seen .chip::after{content:" · vist";font-weight:500}
.how{margin:24px 2px 0;color:var(--muted);font-size:13px}

/* The viewer: the whole screen. A finger drags the Reel and the next one slides in under it. */
#viewer{position:fixed;inset:0;z-index:10;background:#000;color:#fff;display:none;overflow:hidden;touch-action:none;overscroll-behavior:none}
#viewer.on{display:block}
#track{position:absolute;inset:0;will-change:transform}
#track.anim{transition:transform .24s ease-out}
.pane{position:absolute;left:0;right:0;height:100%;background:#000}
.pane img,#v{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#p0{top:-100%}#p1{top:0}#p2{top:100%}
.ui{transition:opacity .15s}
#viewer.dragging .ui{opacity:.25}
.top{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 12px 18px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(rgba(0,0,0,.55),transparent)}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 14px 8px 10px;border-radius:20px;background:rgba(0,0,0,.45);font-size:16px;font-weight:600}
.back svg{width:20px;height:20px}
.count{margin-left:auto;font-size:14px;font-variant-numeric:tabular-nums;opacity:.85}
.bar{position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.2)}
.bar i{display:block;height:100%;width:0;background:#fff}
.bottom{position:absolute;left:0;right:0;bottom:0;padding:48px 16px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,rgba(0,0,0,.8))}
.bottom .stats{font-size:15px;font-weight:600;gap:4px 14px}
.bottom .x{font-weight:800;font-size:17px}
.bottom .when{font-weight:400;opacity:.75}
.line{margin:6px 0 12px;font-size:17px;max-width:30em}
.row{display:flex;gap:10px;align-items:center}
.next{flex:1;padding:13px;border-radius:14px;background:#fff;color:#000;font-weight:700;font-size:17px}
.prev{padding:13px 16px;border-radius:14px;background:rgba(255,255,255,.18);font-weight:700}
.ig{display:inline-block;margin-top:10px;color:#fff;opacity:.7;font-size:13px}
.paused{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:rgba(0,0,0,.45);
  display:none;place-items:center;pointer-events:none}
.paused::before{content:"";margin-left:6px;border-style:solid;border-width:16px 0 16px 26px;border-color:transparent transparent transparent #fff}
#viewer.is-paused .paused{display:grid}
.hint{position:absolute;left:0;right:0;top:42%;text-align:center;font-size:15px;opacity:0;transition:opacity .4s;pointer-events:none}
.hint.show{opacity:.9}
</style>
</head>
<body>

<main id="list">
  <header>
    <img src="../../img/logo.svg" alt="El Tiet">
    <div>
      <h1>{{TITLE}}</h1>
      <p>{{INTRO}}</p>
    </div>
  </header>
  <button class="play-all" id="playAll">▶ Mirar-los tots</button>
  <div class="grid" id="grid"></div>
  <p class="how" {{HOW_HIDDEN}}>×100: el van veure cent vegades més persones que seguidors té el compte.</p>
</main>

<section id="viewer" aria-label="Vídeo">
  <div id="track">
    <div class="pane" id="p0"><img alt=""></div>
    <div class="pane" id="p1"><img alt=""><video id="v" playsinline preload="auto"></video></div>
    <div class="pane" id="p2"><img alt=""></div>
  </div>
  <div class="paused"></div>
  <div class="hint" id="hint">Llisca cap amunt per al següent</div>
  <div class="ui">
    <div class="bar"><i id="prog"></i></div>
    <div class="top">
      <button class="back" id="back"><svg class="i" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>Llista</button>
      <span class="count" id="count"></span>
    </div>
    <div class="bottom">
      <div class="stats" id="stats"></div>
      <div class="line" id="line"></div>
      <div class="row">
        <button class="prev" id="prev" aria-label="Anterior">↑</button>
        <button class="next" id="next">Següent ↓</button>
      </div>
      <a class="ig" id="ig" target="_blank" rel="noopener">Obrir a Instagram ↗</a>
    </div>
  </div>
</section>

<script>
const VID = "../../vid/", IMG = "../../img/", KEY = "seen:{{SLUG}}";
const $ = id => document.getElementById(id);
const esc = t => t.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
const v = $("v"), track = $("track"), viewer = $("viewer");
const R = {{DATA}};
let at = 0, lastT = 0;
const seen = new Set(JSON.parse((() => { try { return localStorage.getItem(KEY) || "[]"; } catch { return "[]"; } })()));
const keepSeen = () => { try { localStorage.setItem(KEY, JSON.stringify([...seen])); } catch {} };

const ICON = {
  likes: '<svg class="i" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>',
  comments: '<svg class="i" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>',
  views: '<svg class="i" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>',
};
// 4,3M · 137K · 1,2K · 936
const n = x => x >= 1e6 ? (x / 1e6).toFixed(1).replace(/\.0$/, "").replace(".", ",") + "M"
  : x >= 1e4 ? Math.round(x / 1e3) + "K" : x >= 1e3 ? (x / 1e3).toFixed(1).replace(/\.0$/, "").replace(".", ",") + "K" : String(x);
const ago = d => { const k = Math.max(0, Math.round((Date.now() - Date.parse(d)) / 864e5)); return k === 0 ? "avui" : k === 1 ? "fa 1 dia" : `fa ${k} dies`; };
const stats = r => ["views", "likes", "comments"].filter(k => r[k] != null).map(k => `<span>${ICON[k]}${n(r[k])}</span>`).join("");

$("grid").innerHTML = R.map((r, i) => `
  <button class="item${seen.has(r.code) ? " seen" : ""}" data-i="${i}">
    <div class="cover"><img src="${IMG}${r.code}.jpg" alt="" loading="lazy">${r.x ? `<span class="chip">${r.x}</span>` : ""}
      <span class="tri"></span><div class="stats">${stats(r)}</div></div>
    <p>${esc(r.line)}</p>
    ${r.date ? `<div class="when">${ago(r.date)}</div>` : ""}
  </button>`).join("");
$("grid").onclick = e => { const b = e.target.closest(".item"); if (b) open(+b.dataset.i); };

const wrap = i => (i + R.length) % R.length;
const poster = (pane, i) => { pane.querySelector("img").src = IMG + R[wrap(i)].code + ".jpg"; };

// One video element, its source swapped: a phone lets it keep its sound after the first tap.
function show(i) {
  at = wrap(i);
  const r = R[at];
  v.pause();
  v.src = VID + r.code + ".mp4";
  v.poster = IMG + r.code + ".jpg";
  poster($("p0"), at - 1); poster($("p1"), at); poster($("p2"), at + 1);
  lastT = 0;
  $("stats").innerHTML = (r.x ? `<span class="x">${r.x}</span>` : "") + stats(r) + (r.date ? `<span class="when">${ago(r.date)}</span>` : "");
  $("line").textContent = r.line;
  $("count").textContent = `${at + 1} de ${R.length}`;
  $("ig").href = r.url;
  $("prog").style.width = "0";
  history.replaceState(null, "", "#v=" + at);
  seen.add(r.code); keepSeen();
  document.querySelector(`.item[data-i="${at}"]`)?.classList.add("seen");
  v.play().catch(() => viewer.classList.add("is-paused"));
}
// Slide the track a whole screen, then put the Reel that slid in at the centre.
let busy = false;
function go(d) {
  if (busy) return;
  busy = true;
  track.classList.add("anim");
  track.style.transform = `translateY(${-d * 100}%)`;
  const done = () => {
    track.removeEventListener("transitionend", done);
    track.classList.remove("anim");
    track.style.transform = "";
    show(at + d);
    busy = false;
  };
  track.addEventListener("transitionend", done);
  setTimeout(() => busy && done(), 400);
}
function snapBack() {
  track.classList.add("anim");
  track.style.transform = "";
  setTimeout(() => track.classList.remove("anim"), 260);
}
function open(i, gesture = true) {
  viewer.classList.add("on");
  document.body.style.overflow = "hidden";
  show(i);
  if (gesture && i === 0) { $("hint").classList.add("show"); setTimeout(() => $("hint").classList.remove("show"), 2200); }
}
function close() {
  v.pause(); viewer.classList.remove("on", "is-paused");
  document.body.style.overflow = "";
  history.replaceState(null, "", location.pathname);
  document.querySelector(`.item[data-i="${at}"]`)?.scrollIntoView({block: "center"});
}
$("playAll").onclick = () => open(0);
$("back").onclick = close;
$("next").onclick = () => go(1);
$("prev").onclick = () => go(-1);
// Only a video watched to its end moves on: a stray «ended» after a jump (seen in WebKit) leaves it where it is.
v.onended = () => { if (v.duration && v.duration - lastT < 1.5) go(1); };
v.onplay = () => viewer.classList.remove("is-paused");
v.onpause = () => viewer.classList.add("is-paused");
v.ontimeupdate = () => { if (v.currentTime - lastT < 1.5) lastT = v.currentTime; if (v.duration) $("prog").style.width = (100 * v.currentTime / v.duration) + "%"; };

// The finger drags the Reel. Let go past a fifth of the screen, or flick, and the next one comes in. A tap pauses.
let y0 = null, t0 = 0, dy = 0;
track.addEventListener("touchstart", e => { if (busy) return; y0 = e.touches[0].clientY; t0 = Date.now(); dy = 0; }, {passive: true});
track.addEventListener("touchmove", e => {
  if (y0 === null) return;
  dy = e.touches[0].clientY - y0;
  if (Math.abs(dy) > 6) viewer.classList.add("dragging");
  track.style.transform = `translateY(${dy}px)`;
  e.preventDefault();
}, {passive: false});
track.addEventListener("touchend", e => {
  if (y0 === null) return;
  y0 = null; viewer.classList.remove("dragging");
  const fast = Math.abs(dy) > 40 && Date.now() - t0 < 250;
  if (Math.abs(dy) > innerHeight / 5 || fast) {
    const d = dy < 0 ? 1 : -1;
    track.classList.add("anim");
    track.style.transform = `translateY(${-d * 100}%)`;
    busy = true;
    setTimeout(() => { track.classList.remove("anim"); track.style.transform = ""; show(at + d); busy = false; }, 250);
  } else if (Math.abs(dy) > 6) snapBack();
  else v.paused ? v.play() : v.pause();
  e.preventDefault();
});
track.addEventListener("click", () => { if (!("ontouchstart" in window)) v.paused ? v.play() : v.pause(); });
document.addEventListener("keydown", e => {
  if (!viewer.classList.contains("on")) return;
  if (e.key === "ArrowDown" || e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowUp" || e.key === "ArrowLeft") go(-1);
  else if (e.key === "Escape") close();
  else if (e.key === " ") { e.preventDefault(); v.paused ? v.play() : v.pause(); }
});
// A link to one Reel opens it straight away.
{ const h = new URLSearchParams(location.hash.slice(1)).get("v"); if (h !== null && R[h]) open(+h, false); }
</script>
</body>
</html>
